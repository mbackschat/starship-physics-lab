[project]
name = "starship-physics-lab"
version = "0.1.0"
description = "Understand Starship. Then build a better one. An interactive rocket physics explorer."
readme = "README.md"
requires-python = ">=3.12"
# Runtime dependencies are deliberately minimal: this app is served as a static
# page and every one of these has to be downloaded into the reader's browser as
# a WebAssembly wheel. scipy and ambiance were dropped in favour of a 40-line
# standard atmosphere and a hand-written integrator, saving about 15 MB.
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "streamlit>=1.40",
    "plotly>=5.24",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "kaleido>=0.2.1",   # PNG export for analysis scripts only, never needed by the app
    "playwright>=1.62.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rocketry", "src/labbook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Freshness is deselected by default on purpose. It fails as a date passes
# rather than as a change lands, so leaving it in would break an unrelated
# commit on a Tuesday and train everyone to ignore it. Run it deliberately:
#   uv run pytest -m freshness
addopts = '-q --strict-markers -m "not freshness"'
markers = [
    "golden: reproduces a documented number from docs/physics-reference.md section 7",
    "freshness: knowledge pages past their stale_after date. Time-dependent, so not in the default run",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "D"]
ignore = [
    "D203",   # incompatible with D211
    "D213",   # incompatible with D212
    "ANN401", # Any is occasionally the honest annotation
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "ANN001", "ANN201", "ANN202"]
# Study scripts are exploratory: no docstring or annotation ceremony, but they
# still have to be correct and readable.
"studies/*/run.py" = ["D", "ANN", "E501", "F541", "N8"]
# Streamlit pages run top-to-bottom as scripts and must extend sys.path before
# importing local components, so module-level imports cannot all come first.
# Streamlit pages run top-to-bottom as scripts and must extend sys.path before
# importing local components, so module-level imports cannot all come first.
# RUF001: the multiplication sign and Streamlit's icon glyphs are intentional.
"app/*" = ["E402", "RUF001"]
"deploy/*" = ["E501"]
"tests/test_deploy.py" = ["SLF001"]  # the build script is ours; testing its internals is fine

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

# plotly ships no py.typed marker. Confined to the two presentation modules that
# import it; the physics core stays fully typed.
[[tool.mypy.overrides]]
module = ["plotly.*"]
ignore_missing_imports = true
