# Rocket engines. See docs/physics-reference.md section 5.1.
#
# provenance: published | estimated | contested | derived
# Thrust in tonnes-force, Isp in seconds, mass in kg.

raptor_3:
  name: Raptor 3 (sea level)
  propellants: CH4/LOX
  thrust_sl_tf: 280.0
  thrust_vac_tf: 268.0
  isp_sl_s: 327.0
  isp_vac_s: 350.0
  mass_kg: 1525.0
  min_throttle: 0.40
  provenance: published
  source: SpaceX, August 2024; Super Heavy Block 3 stack thrust 80.8 MN / 33
  note: >
    Runs throttled to about 250 tf at liftoff, roughly 89 % of its 280 tf
    rating. Wikipedia lists 330 s at sea level for the Block 3 stack; the
    article uses 327 s, which is the Raptor 2 figure and slightly conservative.

raptor_3_vacuum:
  name: Raptor 3 Vacuum
  propellants: CH4/LOX
  thrust_sl_tf: null
  thrust_vac_tf: 300.0
  isp_sl_s: null
  isp_vac_s: 380.0
  mass_kg: 1900.0
  min_throttle: 0.40
  provenance: estimated
  source: Extrapolated from Raptor 2 Vacuum and SpaceX statements
  note: Large nozzle, cannot be run at sea level.

raptor_2:
  name: Raptor 2
  propellants: CH4/LOX
  thrust_sl_tf: 230.0
  thrust_vac_tf: 258.0
  isp_sl_s: 327.0
  isp_vac_s: 347.0
  mass_kg: 1630.0
  min_throttle: 0.40
  provenance: published
  source: SpaceX; Wikipedia SpaceX Raptor
  note: Flew on Super Heavy Block 1 and 2.

merlin_1d:
  name: Merlin 1D (sea level)
  propellants: RP-1/LOX
  thrust_sl_tf: 86.2
  thrust_vac_tf: 93.4
  isp_sl_s: 283.0
  isp_vac_s: 312.0
  mass_kg: 470.0
  min_throttle: 0.57
  provenance: published
  source: Wikipedia Falcon 9, Block 5 figures
  note: Nine of these fly on a Falcon 9 first stage.

merlin_1d_vacuum:
  name: Merlin 1D Vacuum
  propellants: RP-1/LOX
  thrust_sl_tf: null
  thrust_vac_tf: 100.0
  isp_sl_s: null
  isp_vac_s: 348.0
  mass_kg: 490.0
  min_throttle: 0.39
  provenance: published
  source: Wikipedia Falcon 9; 981 kN
  note: Single engine on the Falcon 9 second stage.

vinci:
  name: Vinci
  propellants: LH2/LOX
  thrust_sl_tf: null
  thrust_vac_tf: 18.4
  isp_sl_s: null
  isp_vac_s: 457.0
  mass_kg: 550.0
  min_throttle: 1.0
  provenance: published
  source: ESA, ArianeGroup; 180 kN
  note: >
    Re-ignitable. Powers the Ariane 6 upper stage, whose dry-mass fraction is
    worse than Starship's and which still delivers 22 t. See
    docs/physics-reference.md section 4.

rs_25:
  name: RS-25 (Space Shuttle Main Engine)
  propellants: LH2/LOX
  thrust_sl_tf: 190.0
  thrust_vac_tf: 232.0
  isp_sl_s: 366.0
  isp_vac_s: 452.0
  mass_kg: 3200.0
  min_throttle: 0.67
  provenance: published
  source: NASA
  note: Three flew on each Shuttle orbiter and were recovered with it.

f_1:
  name: F-1
  propellants: RP-1/LOX
  thrust_sl_tf: 690.0
  thrust_vac_tf: 792.0
  isp_sl_s: 263.0
  isp_vac_s: 304.0
  mass_kg: 8400.0
  min_throttle: 1.0
  provenance: published
  source: NASA. Five flew on the Saturn V first stage.
  note: >
    Still the most powerful single-chamber liquid engine ever flown. Note the
    modest specific impulse: kerosene buys thrust, not efficiency.

j_2:
  name: J-2
  propellants: LH2/LOX
  thrust_sl_tf: null
  thrust_vac_tf: 105.0
  isp_sl_s: null
  isp_vac_s: 421.0
  mass_kg: 1788.0
  min_throttle: 1.0
  provenance: published
  source: NASA. Five on the Saturn V second stage, one on the third.
  note: Hydrogen, and the efficiency that comes with it.

be_4:
  name: BE-4
  propellants: CH4/LOX
  thrust_sl_tf: 290.0
  thrust_vac_tf: 320.0
  isp_sl_s: 310.0
  isp_vac_s: 340.0
  mass_kg: 5400.0
  min_throttle: 0.40
  provenance: published
  source: Blue Origin. 2,846 kN at sea level in the uprated version.
  note: Seven fly on New Glenn's reusable first stage.

be_3u:
  name: BE-3U
  propellants: LH2/LOX
  thrust_sl_tf: null
  thrust_vac_tf: 72.4
  isp_sl_s: null
  isp_vac_s: 445.0
  mass_kg: 1500.0
  min_throttle: 0.45
  provenance: published
  source: Blue Origin. 710 kN in vacuum. Two fly on New Glenn's upper stage.
  note: Mass is estimated; Blue Origin has not published it.

yf_100k:
  name: YF-100K
  propellants: RP-1/LOX
  thrust_sl_tf: 127.5
  thrust_vac_tf: 142.3
  isp_sl_s: 301.6
  isp_vac_s: 337.0
  mass_kg: 2000.0
  min_throttle: 0.50
  provenance: published
  source: CASC. Seven fly on the Long March 10B first stage.
  note: Powers the first orbital-class booster ever caught in a net at sea.

p120c:
  name: P120C solid rocket motor
  propellants: HTPB solid
  thrust_sl_tf: 355.0
  thrust_vac_tf: 384.0
  isp_sl_s: 260.0
  isp_vac_s: 278.5
  mass_kg: 11000.0
  min_throttle: 1.0
  provenance: published
  source: Avio, ArianeGroup. 4,650 kN peak, 141 t of propellant each.
  note: >
    A solid motor: it cannot be throttled or shut down, which is why the
    min_throttle is 1. Four strap on to an Ariane 64.

rsrm:
  name: Space Shuttle solid rocket motor (RSRM)
  propellants: PBAN solid
  thrust_sl_tf: 1269.0
  thrust_vac_tf: 1407.0
  isp_sl_s: 242.0
  isp_vac_s: 268.0
  mass_kg: null
  min_throttle: 1.0
  provenance: published
  source: NASA. 12.45 MN at sea level, 13.8 MN in vacuum, 504 t of propellant.
  note: >
    A solid motor, so it cannot be throttled or shut down. Its casing is the
    stage structure rather than a separate engine mass, which is why mass_kg is
    null: counting it here would count it twice.

vulcain_2_1:
  name: Vulcain 2.1
  propellants: LH2/LOX
  thrust_sl_tf: 96.0
  thrust_vac_tf: 137.0
  isp_sl_s: 320.0
  isp_vac_s: 431.0
  mass_kg: 2100.0
  min_throttle: 1.0
  provenance: published
  source: ArianeGroup. 1,340 kN in vacuum.
  note: Powers the Ariane 6 core, which burns alongside the solid boosters.
