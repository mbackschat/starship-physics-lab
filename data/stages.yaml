saturn_v_s_ii:
  name: Saturn V second stage (S-II)
  dry_mass_t: 43.0
  propellant_t: 427.0
  engine: j_2
  engine_count: 5
  diameter_m: 10.1
  isp_ascent_s: 421.0
  residual_propellant_t: 0.0
  provenance: published
  source: NASA. Empty 43 t, gross 470 t.
