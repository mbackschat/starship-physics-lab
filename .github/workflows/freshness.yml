# Knowledge pages carry a stale_after date. Something has to notice when one
# passes, and it cannot be the ordinary test suite: that check fails as a date
# arrives rather than as a change lands, so it would redden an unrelated commit
# on a Monday morning and get ignored or deleted within a month.
#
# So it runs on its own schedule and produces a tracked work item instead of a
# red X on somebody's pull request. One issue, reopened and rewritten while
# pages are due, closed automatically when they are not.
name: Knowledge freshness

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: freshness
  cancel-in-progress: true

env:
  ISSUE_TITLE: Knowledge pages need rechecking

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen

      - name: Look for pages past their recheck date
        id: check
        run: |
          set +e
          uv run python -m knowledge > report.md
          echo "stale=$?" >> "$GITHUB_OUTPUT"
          cat report.md

      - name: Find the existing issue, if there is one
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --state open --search "$ISSUE_TITLE in:title" \
            --json number,title \
            --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number // empty")
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Raise or update the issue
        if: steps.check.outputs.stale != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.existing.outputs.number }}
        run: |
          {
            echo "Found by \`.github/workflows/freshness.yml\` on $(date -u +%Y-%m-%d)."
            echo
            cat report.md
            echo
            echo "The \`knowledge-base\` skill covers how to recheck a page."
            echo "This issue closes itself once nothing is due."
          } > body.md
          if [ -n "$NUMBER" ]; then
            gh issue edit "$NUMBER" --body-file body.md
            echo "updated #$NUMBER"
          else
            gh issue create --title "$ISSUE_TITLE" --body-file body.md
          fi

      - name: Close the issue when nothing is due
        if: steps.check.outputs.stale == '0' && steps.existing.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.existing.outputs.number }}
        run: |
          gh issue close "$NUMBER" \
            --comment "Every page is back within its recheck date. Closed automatically."
